<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xray-панель — адрес</title>
<style>
 body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:24px;background:#f4f5f7;color:#1b1f27}
 .box{max-width:640px;margin:0 auto;background:#fff;border:1px solid #e2e5ea;border-radius:12px;padding:20px}
 code{background:#0f172a;color:#e2e8f0;padding:3px 6px;border-radius:6px}
 a.btn{display:inline-block;margin-top:12px;padding:9px 18px;background:#2563eb;color:#fff;border-radius:8px;text-decoration:none}
 .muted{color:#6b7280;font-size:14px}
</style></head>
<body>
<div class="box">
  <h2 style="margin-top:0">Панель Xray</h2>
  <p>Адрес панели на этом роутере: <code id="addr">/cgi-bin/xraypanel</code></p>
  <p><a class="btn" href="/cgi-bin/xraypanel" target="_blank" rel="noopener">Открыть панель</a></p>
  <p class="muted">Эта страница добавлена пакетом xraypanel, чтобы адрес панели всегда можно было найти из самого роутера. Она не заменяет панель, а только подсказывает путь к ней.</p>
</div>
<script>
  document.getElementById('addr').textContent = location.origin + '/cgi-bin/xraypanel';
</script>
</body></html>
